<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>47Quest ミニゲーム広場</title>
  <link rel="stylesheet" href="./src/featured-games.css">
  <link rel="stylesheet" href="./src/game-gallery.css">
  <script src="./src/prefectures.js" defer></script>
  <script src="./src/character-personalities.js" defer></script>
  <script src="./src/motion-settings.js" defer></script>
  <script src="./src/game-illustrations.js" defer></script>
  <script src="./src/regional-games.js" defer></script>
  <script src="./src/featured-games.js" defer></script>
  <script src="./src/game-audio.js" defer></script>
  <script src="./src/character-art.js" defer></script>
  <script src="./src/character-cries.js" defer></script>
  <script src="./src/game-gallery.js" defer></script>
</head>
<body>
  <button id="sound-toggle" aria-label="音声" aria-pressed="false">音 OFF</button>
  <header><a href="./">← 47Quest ホーム</a><h1>ミニゲーム広場</h1><p id="status"></p></header>
  <main id="gallery"></main>
  <footer id="gallery-pages"><button id="gallery-prev">‹ まえ</button><strong id="gallery-page"></strong><button id="gallery-next">つぎ ›</button></footer>
  <section id="player" hidden>
    <nav><button id="back">← 一覧へ</button><h2 id="game-title"></h2><div class="gallery-audio"><label>BGM <input id="bgm-volume" type="range" min="0" max="100" value="29" aria-label="BGM音量"></label><label>SE・Voice <input id="se-volume" type="range" min="0" max="100" value="42" aria-label="効果音とキャラクターVoiceの音量"></label></div><span id="hud"></span></nav>
    <div id="field"></div>
    <div id="result" hidden><h2>できた！</h2><img id="friend" alt="喜んでいる仲間。タップすると声が聞けます"><p id="record"></p><button id="again">もう一回！</button><button id="return">一覧へ</button></div>
  </section>
</body>
</html>
